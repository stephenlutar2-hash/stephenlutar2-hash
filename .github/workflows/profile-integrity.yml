name: Profile integrity

on:
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/verify_profile.py
      - .github/workflows/profile-integrity.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - assets/**
      - scripts/verify_profile.py
      - .github/workflows/profile-integrity.yml

permissions:
  contents: read

jobs:
  verify-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify profile structure and local assets
        run: python3 scripts/verify_profile.py
